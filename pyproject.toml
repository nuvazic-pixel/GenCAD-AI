[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gencad-ai"
version = "0.3.1"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[project.optional-dependencies]
cad = ["cadquery>=2.5,<3", "trimesh>=4.0,<5"]
