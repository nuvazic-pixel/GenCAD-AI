name: GenCAD-AI geometry_verification_001

on:
  workflow_dispatch:

jobs:
  verify-geometry:
    runs-on: ubuntu-latest

    env:
      GENCAD_GIT_COMMIT: ${{ github.sha }}
      GENCAD_GEOMETRY_VERIFY_OUTPUT: reports/geometry_verification_001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geometry verification extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cad]"

      - name: Run v0.3.1 geometry verification demo
        run: |
          python -m scripts.run_geometry_verification_demo

      - name: Enforce release and quarantine boundary
        shell: bash
        run: |
          test -s reports/geometry_verification_001/released/pipe_saddle_bracket_good.step
          test -s reports/geometry_verification_001/released/pipe_saddle_bracket_good.stl
          test -s reports/geometry_verification_001/released/geometry_verification_report.json
          test -s reports/geometry_verification_001/released/cad_artifact_release_decision.json

          test ! -e reports/geometry_verification_001/released/pipe_saddle_bracket_faulty.step
          test ! -e reports/geometry_verification_001/released/pipe_saddle_bracket_faulty.stl

          test -s reports/geometry_verification_001/quarantine/pipe_saddle_bracket_faulty.step
          test -s reports/geometry_verification_001/quarantine/pipe_saddle_bracket_faulty.stl
          test -s reports/geometry_verification_001/quarantine/geometry_verification_report.json
          test -s reports/geometry_verification_001/quarantine/cad_artifact_release_decision.json

          test -s reports/geometry_verification_001/verification_demo_summary.json

      - name: Upload geometry verification proof
        uses: actions/upload-artifact@v4
        with:
          name: gencad-ai-geometry-verification-001
          path: reports/geometry_verification_001/
          if-no-files-found: error
          retention-days: 90
