name: GenCAD-AI baseline_002 calibration

on:
  workflow_dispatch:
  push:
    paths:
      - ".baseline_002_trigger"

jobs:
  baseline:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.GENCAD }}
      GENCAD_LLM_PROVIDER: openai
      GENCAD_LLM_MODEL: gpt-5.6-sol
      GENCAD_RUN_ID: baseline_002
      GENCAD_PROMPT_VERSION: v1
      GENCAD_BENCHMARK_VERSION: 0.2.3
      GENCAD_SCHEMA_VERSION: 0.2.3
      GENCAD_GIT_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify API key is configured
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret GENCAD is not configured."
            exit 1
          fi

      - name: Run baseline_002 calibration
        id: benchmark
        shell: bash
        run: |
          mkdir -p reports/baseline_002
          set +e
          python -m scripts.run_llm_benchmark 2>&1 | tee reports/baseline_002/runner.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gencad-ai-baseline-002
          path: reports/baseline_002/
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce release gate
        if: steps.benchmark.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::error::baseline_002 did not pass the release gate or the live run failed."
          exit 1
