name: GenCAD-AI baseline_001

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GENCAD_LLM_PROVIDER: openai
      GENCAD_LLM_MODEL: gpt-5.6-sol
      GENCAD_RUN_ID: baseline_001
      GENCAD_PROMPT_VERSION: v1
      GENCAD_GIT_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify API key is configured
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is not configured."
            exit 1
          fi

      - name: Run frozen baseline_001
        id: benchmark
        shell: bash
        run: |
          mkdir -p reports/baseline_001
          set +e
          python scripts/run_llm_benchmark.py 2>&1 | tee reports/baseline_001/runner.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gencad-ai-baseline-001
          path: reports/baseline_001/
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce release gate
        if: steps.benchmark.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::error::baseline_001 did not pass the release gate or the live run failed."
          exit 1
