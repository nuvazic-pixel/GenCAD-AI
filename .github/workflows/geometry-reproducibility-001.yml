name: GenCAD-AI geometry_reproducibility_001

on:
  workflow_dispatch:

jobs:
  reproduce-geometry:
    runs-on: ubuntu-latest

    env:
      GENCAD_GIT_COMMIT: ${{ github.sha }}
      GENCAD_REPRO_OUTPUT: reports/geometry_reproducibility_001
      GENCAD_REPRO_REPEAT_COUNT: "5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CAD reproducibility extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cad]"

      - name: Run deterministic geometry reproducibility demo
        run: |
          python -m scripts.run_geometry_reproducibility_demo

      - name: Enforce reproducibility proof
        shell: bash
        run: |
          test -s reports/geometry_reproducibility_001/geometry_reproducibility_report.json
          test -s reports/geometry_reproducibility_001/reproducibility_demo_summary.json

          for i in 01 02 03 04 05; do
            test -s "reports/geometry_reproducibility_001/replicas/build_${i}/pipe_saddle_bracket.step"
            test -s "reports/geometry_reproducibility_001/replicas/build_${i}/pipe_saddle_bracket.stl"
            test -s "reports/geometry_reproducibility_001/replicas/build_${i}/build_trace.json"
          done

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("reports/geometry_reproducibility_001/geometry_reproducibility_report.json").read_text()
          )
          assert report["passed"] is True
          assert report["repeat_count"] == 5
          assert report["fingerprints_match"] is True
          assert len(report["unique_geometry_fingerprints"]) == 1
          assert report["all_verified"] is True
          assert report["all_releasable"] is True
          assert report["sensitivity_control_differs"] is True
          assert report["failed_rules"] == []
          PY

      - name: Upload reproducibility proof
        uses: actions/upload-artifact@v4
        with:
          name: gencad-ai-geometry-reproducibility-001
          path: reports/geometry_reproducibility_001/
          if-no-files-found: error
          retention-days: 90
